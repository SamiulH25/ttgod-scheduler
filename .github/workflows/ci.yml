name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ttgod
          POSTGRES_PASSWORD: ttgod_ci
          POSTGRES_DB: ttgod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttgod -d ttgod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ttgod:ttgod_ci@localhost:5432/ttgod_test?schema=public
      AUTH_SECRET: ci-auth-secret-min-16-chars
      AUTH_URL: http://localhost:3000
      AUTH_DISCORD_ID: ci-discord-id
      AUTH_DISCORD_SECRET: ci-discord-secret
      BOT_API_SECRET: ci-bot-secret-min-16-chars
      SKIP_ENV_VALIDATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ttgod
          POSTGRES_PASSWORD: ttgod_ci
          POSTGRES_DB: ttgod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttgod -d ttgod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ttgod:ttgod_ci@localhost:5432/ttgod_test?schema=public
      AUTH_SECRET: ci-auth-secret-min-16-chars
      AUTH_URL: http://localhost:3000
      AUTH_DISCORD_ID: ci-discord-id
      AUTH_DISCORD_SECRET: ci-discord-secret
      BOT_API_SECRET: ci-bot-secret-min-16-chars
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
